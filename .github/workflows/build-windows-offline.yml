name: Build Windows offline installer

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-runtime-update]

permissions:
  contents: read

concurrency:
  group: windows-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      OPENHARNESS_RUNTIME_OS: windows
      OPENHARNESS_RUNTIME_CPU: x64
      OPENHARNESS_BUILD_NUMBER: ${{ github.run_number }}
      OPENHARNESS_REQUIRE_BROWSER_USE_MCP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2025-08-07
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Detect system Chrome or Edge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            @{ Root = $env:ProgramFiles; Path = 'Google\Chrome\Application\chrome.exe' },
            @{ Root = ${env:ProgramFiles(x86)}; Path = 'Google\Chrome\Application\chrome.exe' },
            @{ Root = $env:LOCALAPPDATA; Path = 'Google\Chrome\Application\chrome.exe' },
            @{ Root = ${env:ProgramFiles(x86)}; Path = 'Microsoft\Edge\Application\msedge.exe' },
            @{ Root = $env:ProgramFiles; Path = 'Microsoft\Edge\Application\msedge.exe' }
          )
          $browser = $null
          foreach ($candidate in $candidates) {
            if (-not $candidate.Root) { continue }
            $path = Join-Path $candidate.Root $candidate.Path
            if (Test-Path -LiteralPath $path) { $browser = $path; break }
          }
          if (-not $browser) { throw 'No Chrome or Edge installation found' }
          Write-Host "Using browser: $browser"
          "OPENHARNESS_BROWSER_EXECUTABLE=$browser" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
      - name: Assemble locked Windows runtime
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: JavaScript tests
        shell: bash
        run: node --test scripts/*.test.mjs
      - name: Rust formatting and tests
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
      - name: Build installer with offline WebView2
        run: bun run tauri build --bundles nsis --config src-tauri/tauri.windows-offline.conf.json --ci
      - name: Install and smoke test installed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'OpenHarness 安装 测试'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'OpenHarness.exe'))) { throw 'Installed desktop executable is missing' }
          node scripts/smoke-runtime.mjs (Join-Path $installDir 'runtime')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test the verbatim resource path form
        shell: pwsh
        run: |
          # Tauri's resource_dir() is a verbatim path on Windows. Node cannot
          # resolve `\\?\C:\...` as a module entry, so the packaged runtime must
          # be shown to boot when given exactly that form.
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'OpenHarness 安装 测试'
          $verbatim = Join-Path '\\?\' (Join-Path $installDir 'runtime')
          if (-not $verbatim.StartsWith('\\?\')) { throw "Not a verbatim path: $verbatim" }
          node scripts/smoke-runtime.mjs $verbatim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test the bundled browser MCP
        shell: pwsh
        run: |
          # Drives a real page through the packaged Node, Python engine, and the
          # system Chrome/Edge, without any network install at run time.
          $ErrorActionPreference = 'Stop'
          if (-not $env:OPENHARNESS_BROWSER_EXECUTABLE) { throw 'System browser was not detected' }
          $installDir = Join-Path $env:RUNNER_TEMP 'OpenHarness 安装 测试'
          node scripts/smoke-browser-use.mjs (Join-Path $installDir 'runtime') $env:OPENHARNESS_BROWSER_EXECUTABLE
      - name: Launch installed app with an isolated DSH_HOME
        shell: pwsh
        run: |
          # Exercises the real code path end to end: the host resolves its own
          # resource directory, spawns the bundled runtime, and reports the URL.
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'OpenHarness 安装 测试'
          # PowerShell treats $HOME as read-only, so use a distinct name.
          $dshHome = Join-Path $env:RUNNER_TEMP 'OpenHarness dsh home'
          $env:DSH_HOME = $dshHome
          New-Item -ItemType Directory -Force $dshHome | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'team.MicroSpotlight.OpenHarness\OpenHarness\logs\backend.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath (Join-Path $installDir 'OpenHarness.exe') -PassThru
          $deadline = (Get-Date).AddSeconds(75)
          while ((Get-Date) -lt $deadline) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'dsh web: \[startup URL omitted\]' -Quiet)) { break }
            if ($app.HasExited) { break }
            Start-Sleep -Seconds 3
          }
          $logged = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          if ($logged -notmatch 'dsh web: \[startup URL omitted\]') {
            Write-Host "--- backend.log ---"
            Write-Host $logged
            throw 'The installed app never reported a backend URL'
          }
          if ($logged -match 'EISDIR|before reporting its URL|backend spawn failed') {
            Write-Host $logged
            throw 'The installed app logged a backend startup failure'
          }
          if ($logged -notmatch 'browser-use-mcp serving MCP on stdio') {
            Write-Host $logged
            throw 'The bundled browser MCP did not start'
          }
          Get-Process OpenHarness -ErrorAction SilentlyContinue | Stop-Process -Force
          # Only the bundled runtime, never the runner's own Node processes.
          Get-Process node -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path.StartsWith($installDir, 'OrdinalIgnoreCase') } |
            Stop-Process -Force
          Write-Host 'PASS: the installed app started its bundled runtime'
      - name: Collect verified installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe'
          $name = 'OpenHarness_windows_x64_offline-setup.exe'
          $output = Join-Path $PWD "dist/windows/$name"
          Copy-Item $installer.FullName $output
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/windows/$name.sha256" -Encoding utf8
          $runtime = (Get-Content runtime/package.json -Raw | ConvertFrom-Json).dependencies.'@deepseek-ai/dsh'
          @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "Runtime: $runtime"
            "Architecture: Windows x64"
            "Browser MCP: @ricardochen1996/browser-use-mcp 0.1.5 (system Chrome/Edge)"
            "Python engine: bundled; no pip or browser download at run time"
            "WebView2: bundled offline installer"
            "Validation: Windows tests, installed-runtime smoke, and browser MCP page-open smoke passed"
            "Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Unsigned private build. Back up DSH_HOME before installing."
          ) | Set-Content dist/windows/BUILD.txt -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenHarness-windows-x64-offline
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30
