name: Build Windows offline installer

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-runtime-update]

permissions:
  contents: read

concurrency:
  group: windows-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      OPENHARNESS_RUNTIME_OS: windows
      OPENHARNESS_RUNTIME_CPU: x64
      OPENHARNESS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2025-08-07
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Assemble locked Windows runtime
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: JavaScript tests
        shell: bash
        run: node --test scripts/*.test.mjs
      - name: Rust formatting and tests
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
      - name: Build installer with offline WebView2
        run: bun run tauri build --bundles nsis --config src-tauri/tauri.windows-offline.conf.json --ci
      - name: Install and smoke test installed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'OpenHarness 安装 测试'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'OpenHarness.exe'))) { throw 'Installed desktop executable is missing' }
          node scripts/smoke-runtime.mjs (Join-Path $installDir 'runtime')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect verified installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe'
          $name = 'OpenHarness_windows_x64_offline-setup.exe'
          $output = Join-Path $PWD "dist/windows/$name"
          Copy-Item $installer.FullName $output
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/windows/$name.sha256" -Encoding utf8
          $runtime = (Get-Content runtime/package.json -Raw | ConvertFrom-Json).dependencies.'@deepseek-ai/dsh'
          @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "Runtime: $runtime"
            "Architecture: Windows x64"
            "WebView2: bundled offline installer"
            "Validation: Windows tests and installed-runtime smoke test passed"
            "Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Unsigned private build. Back up DSH_HOME before installing."
          ) | Set-Content dist/windows/BUILD.txt -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenHarness-windows-x64-offline
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30
